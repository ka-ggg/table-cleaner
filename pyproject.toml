[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "table-cleaner"
version = "2.0.1"
description = "CSV/XLSX 表格清洗工具：检查空值/重复行/可疑格式，按规则清洗并导出"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ka-ggg" }]
keywords = ["csv", "xlsx", "data-cleaning", "pandas", "streamlit"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "streamlit>=1.50,<2",
    "pandas>=2.2,<4",
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff==0.17.4",
    "mypy==2.4.1",
    "coverage==7.17.2",
]

[tool.setuptools.packages.find]
include = ["cleaning*"]

[tool.ruff]
# 全仓共用一份配置：本地、CI、编辑器都读这里，不在命令行临时拼参数。
line-length = 120
target-version = "py311"
src = ["app.py", "cleaning", "tests"]
exclude = [".venv", "__pycache__", ".pytest_cache", ".mypy_cache", ".ruff_cache", "build", "dist", "*.md"]

[tool.ruff.lint]
# E/F 是语法与未用导入等基础检查，I 统一导入顺序；不引入会改语义的规则。
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
files = ["cleaning"]
# 非严格模式：先把 cleaning/ 纳入检查并公布基线，存量错误按棘轮逐版清。
ignore_missing_imports = true
follow_imports = "silent"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
pretty = true
exclude = ["(?x)(^\\.venv/|__pycache__|^\\.mypy_cache/)"]

[tool.coverage.run]
source = ["cleaning"]
branch = false
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
precision = 0
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
